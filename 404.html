<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>404 | vinidimo</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo-black.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="assets/logo-white.svg" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="styles.css?v=20260826-1">
    <link href="https://fonts.googleapis.com/css?family=Anton|Passion+One|PT+Sans+Caption" rel="stylesheet"
        type="text/css">
    <style>
        .text-center {
            text-align: center;
        }

        .error {
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 82px 1rem 1rem;
            font-family: 'PT Sans Caption', sans-serif, Arial, 'Times New Roman';
        }

        .container-floud,
        .col-xs-12 {
            width: 100%;
        }

        .error .clip .shadow {
            height: 180px;
        }

        .error .clip:nth-of-type(2) .shadow {
            width: 130px;
        }

        .error .clip:nth-of-type(1) .shadow,
        .error .clip:nth-of-type(3) .shadow {
            width: 250px;
        }

        .error .digit {
            width: 150px;
            height: 150px;
            line-height: 150px;
            font-size: 120px;
            font-weight: bold;
        }

        .error h2 {
            font-size: 32px;
        }

        .error .container-error-404 {
            margin-top: 0;
            position: relative;
            height: 250px;
            padding-top: 40px;
        }

        .error .container-error-404 .clip {
            display: inline-block;
            transform: skew(-45deg);
        }

        .error .clip .shadow {
            overflow: hidden;
        }

        .error .clip:nth-of-type(2) .shadow {
            overflow: hidden;
            position: relative;
            box-shadow: inset 20px 0px 20px -15px rgba(150, 150, 150, 0.8), 20px 0px 20px -15px rgba(150, 150, 150, 0.8);
        }

        .error .clip:nth-of-type(3) .shadow:after,
        .error .clip:nth-of-type(1) .shadow:after {
            content: "";
            position: absolute;
            right: -8px;
            bottom: 0px;
            z-index: 9999;
            height: 100%;
            width: 10px;
            background: linear-gradient(90deg, transparent, rgba(173, 173, 173, 0.8), transparent);
            border-radius: 50%;
        }

        .error .clip:nth-of-type(3) .shadow:after {
            left: -8px;
        }

        .error .digit {
            position: relative;
            top: 8%;
            color: white;
            background: #07B3F9;
            border-radius: 50%;
            display: inline-block;
            transform: skew(45deg);
        }

        .error .clip:nth-of-type(2) .digit {
            left: -10%;
        }

        .error .clip:nth-of-type(1) .digit {
            right: -20%;
        }

        .error .clip:nth-of-type(3) .digit {
            left: -20%;
        }

        .error h2 {
            color: #A2A2A2;
            font-weight: bold;
            padding-bottom: 20px;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.75rem 1.25rem;
            border-radius: 999px;
            background: #07B3F9;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 12px 24px rgba(7, 179, 249, 0.22);
        }

        .overlay {
            position: relative;
            z-index: 20;
        }

        .ground-color {
            background: white;
        }

        .item-bg-color {
            background: #EAEAEA;
        }

        .padding-top {
            padding-top: 10px;
        }

        .padding-bottom {
            padding-bottom: 10px;
        }

        .padding-vertical {
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .padding-horizontal {
            padding-left: 10px;
            padding-right: 10px;
        }

        .padding-all {
            padding: 10px;
        }

        .no-padding-left {
            padding-left: 0px;
        }

        .no-padding-right {
            padding-right: 0px;
        }

        .no-vertical-padding {
            padding-top: 0px;
            padding-bottom: 0px;
        }

        .no-horizontal-padding {
            padding-left: 0px;
            padding-right: 0px;
        }

        .no-padding {
            padding: 0px;
        }

        .margin-top {
            margin-top: 10px;
        }

        .margin-bottom {
            margin-bottom: 10px;
        }

        .margin-right {
            margin-right: 10px;
        }

        .margin-left {
            margin-left: 10px;
        }

        .margin-horizontal {
            margin-left: 10px;
            margin-right: 10px;
        }

        .margin-vertical {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .margin-all {
            margin: 10px;
        }

        .no-margin {
            margin: 0px;
        }

        .no-vertical-margin {
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .no-horizontal-margin {
            margin-left: 0px;
            margin-right: 0px;
        }

        .inside-col-shrink {
            margin: 0px 20px;
        }

        hr {
            margin: 0px;
            padding: 0px;
            border-top: 1px dashed #999;
        }

        @media(max-width: 900px) {
            .error {
                padding-top: 68px;
            }
        }

        @media(max-width: 767px) {
            .error .clip .shadow {
                height: 100px;
            }

            .error .clip:nth-of-type(2) .shadow {
                width: 80px;
            }

            .error .clip:nth-of-type(1) .shadow,
            .error .clip:nth-of-type(3) .shadow {
                width: 100px;
            }

            .error .digit {
                width: 80px;
                height: 80px;
                line-height: 80px;
                font-size: 52px;
            }

            .error h2 {
                font-size: 24px;
            }

            .error .container-error-404 {
                height: 150px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <a class="brand" href="/" aria-label="Voltar para a página inicial">
                <img src="assets/logo-white.svg" alt="vinidimo" width="42" height="42">
                <span class="brand-wordmark">vinidimo</span>
            </a>
        </div>
    </header>

    <div class="error">
        <div class="container-floud">
            <div class="col-xs-12 ground-color text-center">
                <div class="container-error-404">
                    <div class="clip">
                        <div class="shadow"><span class="digit thirdDigit"></span></div>
                    </div>
                    <div class="clip">
                        <div class="shadow"><span class="digit secondDigit"></span></div>
                    </div>
                    <div class="clip">
                        <div class="shadow"><span class="digit firstDigit"></span></div>
                    </div>
                </div>
                <h2 class="h1">Desculpe! Página não encontrada</h2>
                <a class="home-link" href="/">Voltar para página inicial</a>
            </div>
        </div>
    </div>

    <script>
        function randomNum() {
            "use strict";
            return Math.floor(Math.random() * 9) + 1;
        }

        var loop1,
            loop2,
            loop3,
            time = 30,
            i = 0,
            selector3 = document.querySelector('.thirdDigit'),
            selector2 = document.querySelector('.secondDigit'),
            selector1 = document.querySelector('.firstDigit');

        loop3 = setInterval(function () {
            "use strict";
            if (i > 40) {
                clearInterval(loop3);
                selector3.textContent = 4;
            } else {
                selector3.textContent = randomNum();
                i++;
            }
        }, time);

        loop2 = setInterval(function () {
            "use strict";
            if (i > 80) {
                clearInterval(loop2);
                selector2.textContent = 0;
            } else {
                selector2.textContent = randomNum();
                i++;
            }
        }, time);

        loop1 = setInterval(function () {
            "use strict";
            if (i > 100) {
                clearInterval(loop1);
                selector1.textContent = 4;
            } else {
                selector1.textContent = randomNum();
                i++;
            }
        }, time);
    </script>
</body>

</html>
