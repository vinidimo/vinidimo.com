<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>404 | vinidimo</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo-black.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="/assets/logo-white.svg" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="/styles.css?v=20260826-1">
    <style>
        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #fff;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            text-align: center;
        }

        body>div:not(.scrollDist),
        main {
            position: absolute;
        }

        header {
            z-index: 20;
        }

        .scrollDist {
            width: 100%;
            height: 200vh;
            min-height: 200vh;
        }

        @supports (height: 100svh) {

            html,
            body {
                min-height: 100svh;
            }

            .scrollDist {
                height: 200svh;
                min-height: 200svh;
            }
        }

        .parallax-404 {
            position: fixed;
            top: 0;
            left: 50%;
            width: 100%;
            max-width: none;
            height: 100vh;
            background: #4f89bd;
            transform: translateX(-50%);
            overflow: hidden;
        }

        @supports (height: 100svh) {
            .parallax-404 {
                height: 100svh;
            }
        }

        .sky {
            fill: url("#skyGradient");
        }

        .mountBg {
            opacity: 0.68;
        }

        .mountMg {
            opacity: 0.72;
        }

        .mountFg {
            opacity: 0.78;
        }

        .mountBg,
        .mountMg,
        .mountFg {
            transform-box: fill-box;
            transform-origin: center bottom;
        }

        .parallax-404 svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .error-text {
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            font-weight: 900;
            letter-spacing: -0.08em;
        }

        .error-text--top {
            font-size: 210px;
        }

        .error-text--bottom {
            font-size: 118px;
            letter-spacing: -0.06em;
        }

        .home-link-404 {
            position: fixed;
            left: 50%;
            bottom: 2rem;
            z-index: 21;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.75rem 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 999px;
            background: rgba(17, 27, 41, 0.72);
            color: #fff;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            transform: translateX(-50%);
            backdrop-filter: blur(12px);
        }

        @media (max-width: 760px) {
            .error-text--top {
                font-size: 180px;
            }

            .error-text--bottom {
                font-size: 54px;
                letter-spacing: -0.08em;
            }

            .home-link-404 {
                bottom: 1rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <a class="brand" href="/" aria-label="Voltar para a página inicial">
                <img src="/assets/logo-white.svg" alt="vinidimo" width="42" height="42">
                <span class="brand-wordmark">vinidimo</span>
            </a>
        </div>
    </header>

    <div class="scrollDist"></div>

    <main class="parallax-404">
        <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"
            xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
            <defs>
                <linearGradient id="skyGradient" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0%" stop-color="#4f89bd" />
                    <stop offset="48%" stop-color="#8fb8cf" />
                    <stop offset="100%" stop-color="#d9e7ec" />
                </linearGradient>
                <filter id="softCloud" x="-15%" y="-90%" width="130%" height="260%">
                    <feGaussianBlur stdDeviation="16" />
                </filter>
            </defs>

            <mask id="m">
                <g class="cloud1Mask">
                    <rect fill="#fff" width="100%" height="801" y="799" />
                    <image href="/assets/content/404/cloud1.webp" xlink:href="/assets/content/404/cloud1.webp" x="-36"
                        y="-18" width="1272" height="836" preserveAspectRatio="xMidYMid slice" />
                    <g class="maskCloudBreak">
                        <ellipse cx="60" cy="790" rx="160" ry="54" fill="#fff" filter="url(#softCloud)" />
                        <ellipse cx="230" cy="774" rx="210" ry="66" fill="#fff" filter="url(#softCloud)" />
                        <ellipse cx="430" cy="796" rx="190" ry="58" fill="#fff" filter="url(#softCloud)" />
                        <ellipse cx="620" cy="770" rx="230" ry="70" fill="#fff" filter="url(#softCloud)" />
                        <ellipse cx="835" cy="792" rx="210" ry="62" fill="#fff" filter="url(#softCloud)" />
                        <ellipse cx="1040" cy="776" rx="230" ry="68" fill="#fff" filter="url(#softCloud)" />
                        <ellipse cx="1220" cy="794" rx="180" ry="56" fill="#fff" filter="url(#softCloud)" />
                    </g>
                </g>
            </mask>

            <rect class="sky" width="1200" height="800" />
            <image class="mountBg" href="/assets/content/404/mountBg.webp" xlink:href="/assets/content/404/mountBg.webp"
                x="-36" y="-18" width="1272" height="836" preserveAspectRatio="xMidYMid slice" />
            <image class="mountMg" href="/assets/content/404/mountMg.webp" xlink:href="/assets/content/404/mountMg.webp"
                x="-36" y="-18" width="1272" height="836" preserveAspectRatio="xMidYMid slice" />
            <image class="cloud2" href="/assets/content/404/cloud2.webp" xlink:href="/assets/content/404/cloud2.webp"
                width="1200" height="800" />
            <image class="mountFg" href="/assets/content/404/mountFg.png" xlink:href="/assets/content/404/mountFg.png"
                x="-36" y="-18" width="1272" height="836" preserveAspectRatio="xMidYMid slice" />
            <image class="cloud1" href="/assets/content/404/cloud1.webp" xlink:href="/assets/content/404/cloud1.webp"
                x="-36" y="-18" width="1272" height="836" preserveAspectRatio="xMidYMid slice" />
            <image class="cloud3" href="/assets/content/404/cloud3.webp" xlink:href="/assets/content/404/cloud3.webp"
                width="1200" height="800" />
            <g class="lowClouds" aria-hidden="true">
                <rect x="-80" y="696" width="1360" height="180" fill="#fff" />
                <ellipse cx="75" cy="688" rx="170" ry="78" fill="#fff" filter="url(#softCloud)" opacity="0.96" />
                <ellipse cx="265" cy="662" rx="230" ry="92" fill="#fff" filter="url(#softCloud)" opacity="0.92" />
                <ellipse cx="510" cy="687" rx="255" ry="88" fill="#fff" filter="url(#softCloud)" opacity="0.97" />
                <ellipse cx="760" cy="654" rx="260" ry="96" fill="#fff" filter="url(#softCloud)" opacity="0.93" />
                <ellipse cx="1010" cy="678" rx="300" ry="104" fill="#fff" filter="url(#softCloud)" opacity="0.98" />
                <ellipse cx="1215" cy="642" rx="190" ry="84" fill="#fff" filter="url(#softCloud)" opacity="0.95" />
                <ellipse cx="610" cy="712" rx="700" ry="72" fill="#fff" opacity="0.92" />
            </g>

            <g class="error-copy">
                <text class="error-text error-text--top" fill="#fff" x="600" y="360" text-anchor="middle">404</text>
            </g>

            <g mask="url(#m)">
                <rect fill="#fff" width="100%" height="100%" />
                <text class="error-text error-text--bottom" x="600" y="360" text-anchor="middle" fill="#162a43">NOT
                    FOUND</text>
            </g>

        </svg>
    </main>

    <a class="home-link-404" href="/">Voltar para o início</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
        window.addEventListener("load", () => {
            gsap.registerPlugin(ScrollTrigger);

            gsap
                .timeline({
                    scrollTrigger: {
                        trigger: ".scrollDist",
                        start: "0 0",
                        end: "100% 100%",
                        scrub: 1
                    }
                })
                .fromTo(".sky", { y: 0 }, { y: -120 }, 0)
                .fromTo(".cloud1", { y: 180 }, { y: -720 }, 0)
                .fromTo(".cloud1Mask", { y: 180 }, { y: -720 }, 0)
                .fromTo(".cloud2", { y: -80 }, { y: -440 }, 0)
                .fromTo(".cloud3", { y: 20 }, { y: -560 }, 0)
                .fromTo(".lowClouds", { y: 0 }, { y: -120 }, 0)
                .fromTo(".mountBg", { y: 0 }, { y: -56 }, 0)
                .fromTo(".mountMg", { y: 0 }, { y: -118 }, 0)
                .fromTo(".mountFg", { y: 0 }, { y: -188 }, 0);

        });
    </script>
</body>

</html>
