<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Síntese aditiva no sistema RGB</title>
  <desc id="desc">Luzes vermelha, verde e azul se sobrepõem e formam amarelo, ciano, magenta e branco.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/><stop offset="1" stop-color="#152a43"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="26" fill="url(#bg)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="70" y="82" fill="#fff" font-size="34" font-weight="750">RGB soma luz</text>
    <text x="70" y="126" fill="#b8c8dc" font-size="22">Quanto mais luz é adicionada, mais claro fica o resultado.</text>
  </g>
  <g transform="translate(196 170)" style="isolation:isolate" filter="url(#glow)">
    <circle cx="250" cy="190" r="175" fill="#ff2035" style="mix-blend-mode:screen"/>
    <circle cx="410" cy="190" r="175" fill="#18dc63" style="mix-blend-mode:screen"/>
    <circle cx="330" cy="330" r="175" fill="#2478ff" style="mix-blend-mode:screen"/>
  </g>
  <g fill="#fff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750" text-anchor="middle">
    <text x="342" y="285">VERMELHO</text><text x="666" y="285">VERDE</text><text x="504" y="646">AZUL</text>
    <text x="504" y="285" fill="#10151e">AMARELO</text><text x="420" y="445" fill="#10151e">MAGENTA</text><text x="589" y="445" fill="#10151e">CIANO</text>
    <text x="504" y="393" fill="#10151e">BRANCO</text>
  </g>
  <g transform="translate(850 210)" font-family="Inter, Arial, sans-serif">
    <text fill="#7188a2" font-size="18" font-weight="750" letter-spacing="2">COMEÇA NO PRETO</text>
    <rect y="34" width="250" height="96" rx="18" fill="#02050a" stroke="#37506b" stroke-width="2"/>
    <text x="125" y="93" fill="#fff" text-anchor="middle" font-size="23" font-weight="700">sem emissão</text>
    <path d="M125 153v55" stroke="#7188a2" stroke-width="3"/><path d="m115 197 10 12 10-12" fill="none" stroke="#7188a2" stroke-width="3"/>
    <rect y="232" width="250" height="96" rx="18" fill="#fff"/>
    <text x="125" y="291" fill="#101923" text-anchor="middle" font-size="23" font-weight="700">R + G + B</text>
    <text y="385" fill="#b8c8dc" font-size="20">Destino: telas</text>
    <text y="420" fill="#b8c8dc" font-size="20">Modo: emissão</text>
  </g>
</svg>
