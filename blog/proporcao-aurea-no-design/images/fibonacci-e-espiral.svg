<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Espiral construída com quadrados de Fibonacci</title>
  <desc id="desc">Quadrados com lados 8, 5, 3, 2, 1 e 1 recebem, cada um, um arco de um quarto de círculo. Os arcos conectados formam a espiral de Fibonacci.</desc>
  <rect width="1200" height="760" fill="#0d1b2c"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="70" y="76" fill="#fff" font-size="34" font-weight="750">Um quarto de círculo em cada quadrado</text>
    <text x="70" y="118" fill="#b9c8da" font-size="21">Os lados seguem 8, 5, 3, 2, 1 e 1. A união dos arcos cria a espiral.</text>
  </g>

  <g transform="translate(70 190)">
    <g fill="none" stroke="#66819e" stroke-width="3">
      <rect x="0" y="0" width="440" height="440"/>
      <rect x="440" y="0" width="275" height="275"/>
      <rect x="550" y="275" width="165" height="165"/>
      <rect x="440" y="330" width="110" height="110"/>
      <rect x="440" y="275" width="55" height="55"/>
      <rect x="495" y="275" width="55" height="55"/>
    </g>

    <g fill="#f0cb6d" font-family="Inter, Arial, sans-serif" font-weight="800">
      <text x="28" y="42" font-size="28">8</text>
      <text x="468" y="42" font-size="28">5</text>
      <text x="674" y="315" font-size="25">3</text>
      <text x="457" y="418" font-size="23">2</text>
      <text x="454" y="310" font-size="17">1</text>
      <text x="509" y="310" font-size="17">1</text>
    </g>

    <g fill="none" stroke="#f0cb6d" stroke-width="8" stroke-linecap="round">
      <path d="M0 440 A440 440 0 0 1 440 0"/>
      <path d="M440 0 A275 275 0 0 1 715 275"/>
      <path d="M715 275 A165 165 0 0 1 550 440"/>
      <path d="M550 440 A110 110 0 0 1 440 330"/>
      <path d="M440 330 A55 55 0 0 1 495 275"/>
      <path d="M495 275 A55 55 0 0 1 550 330"/>
    </g>

    <g fill="#8ea6bf" font-family="Inter, Arial, sans-serif" font-size="17">
      <text x="0" y="480">Cada trecho dourado é exatamente ¼ de uma circunferência.</text>
    </g>
  </g>

  <g transform="translate(845 192)" font-family="Inter, Arial, sans-serif">
    <text fill="#7f94aa" font-size="18" font-weight="750" letter-spacing="2">RAZÕES CONSECUTIVAS</text>
    <text x="0" y="70" fill="#fff" font-size="29">3 ÷ 2 = 1,5</text>
    <text x="0" y="126" fill="#fff" font-size="29">5 ÷ 3 = 1,666…</text>
    <text x="0" y="182" fill="#fff" font-size="29">8 ÷ 5 = 1,6</text>
    <text x="0" y="238" fill="#fff" font-size="29">13 ÷ 8 = 1,625</text>
    <path d="M0 278h270" stroke="#314a65" stroke-width="2"/>
    <text x="0" y="330" fill="#f0cb6d" font-size="30" font-weight="800">→ 1,618033…</text>
    <rect y="380" width="280" height="120" rx="18" fill="#142a43"/>
    <text x="22" y="420" fill="#b9c8da" font-size="17">A espiral de Fibonacci</text>
    <text x="22" y="450" fill="#b9c8da" font-size="17">é uma aproximação visual</text>
    <text x="22" y="480" fill="#b9c8da" font-size="17">da espiral áurea.</text>
  </g>
</svg>
