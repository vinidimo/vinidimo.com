<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Proporção áurea aplicada a uma composição visual</title>
  <desc id="desc">Retângulos dourados, uma espiral e formas geométricas sobre fundo azul escuro.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091321"/>
      <stop offset="1" stop-color="#173557"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d779"/>
      <stop offset="1" stop-color="#b77a12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <circle cx="1260" cy="150" r="300" fill="#1c4d75" opacity=".28"/>
  <circle cx="190" cy="900" r="360" fill="#06101d" opacity=".45"/>
  <g transform="translate(710 145)" fill="none" stroke="url(#gold)" stroke-width="5">
    <rect x="0" y="0" width="400" height="400" rx="3"/>
    <rect x="400" y="0" width="250" height="250" rx="3"/>
    <rect x="500" y="250" width="150" height="150" rx="3"/>
    <rect x="400" y="300" width="100" height="100" rx="3"/>
    <rect x="400" y="250" width="50" height="50" rx="3"/>
    <rect x="450" y="250" width="50" height="50" rx="3"/>
    <g stroke-width="9" stroke-linecap="round" filter="url(#glow)">
      <path d="M0 400 A400 400 0 0 1 400 0"/>
      <path d="M400 0 A250 250 0 0 1 650 250"/>
      <path d="M650 250 A150 150 0 0 1 500 400"/>
      <path d="M500 400 A100 100 0 0 1 400 300"/>
      <path d="M400 300 A50 50 0 0 1 450 250"/>
      <path d="M450 250 A50 50 0 0 1 500 300"/>
    </g>
  </g>
  <circle cx="258" cy="430" r="168" fill="none" stroke="#f1cc68" stroke-width="2" opacity=".18"/>
  <circle cx="258" cy="430" r="104" fill="none" stroke="#f1cc68" stroke-width="2" opacity=".12"/>
  <path d="M90 430h336M258 262v336" stroke="#f1cc68" stroke-width="2" opacity=".1"/>
</svg>
